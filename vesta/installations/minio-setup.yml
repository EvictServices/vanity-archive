services:
  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: NRPwlFDwuh-m5HSG3-CoCQ
      MINIO_BROWSER: "on"
      MINIO_BROWSER_REDIRECT_URL: "https://buckets.example.com"
      MINIO_BROWSER_REDIRECT: "off"
      MINIO_SERVER_URL: "https://s3.example.com"
      MINIO_DOMAIN: "s3.example.com"
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9090" --address ":9000"