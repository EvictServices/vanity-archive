[project]
name = "evict-vanity"
version = "0.1.0"
description = "Reward your members for having your vanity url in their status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp-cors>=0.8.1",
    "anyio>=4.12.0",
    "arrow>=1.4.0",
    "asyncpg>=0.31.0",
    "asyncspotify>=0.12.1",
    "boltons>=25.0.0",
    "bs4>=0.0.2",
    "cairosvg>=2.8.2",
    "cashews>=7.4.3",
    "colorama>=0.4.6",
    "colorthief>=0.2.1",
    "dateparser>=1.2.2",
    "discord-py",
    "humanfriendly>=10.0",
    "humanize>=4.14.0",
    "jishaku",
    "lru-dict>=1.4.1",
    "lxml>=6.0.2",
    "markers>=0.3.0",
    "minio>=7.2.20",
    "pillow>=12.0.0",
    "psutil>=7.1.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pylast>=7.0.0",
    "python-dotenv>=1.2.1",
    "rapidfuzz>=3.14.3",
    "redis>=7.1.0",
    "shazamio>=0.8.1",
    "tornado>=6.5.2",
    "uwuipy",
    "xxhash>=3.6.0",
]

[tool.uv.sources]
discord-py = { git = "https://github.com/Rapptz/discord.py.git" }
jishaku = { git = "https://github.com/scarletcafe/jishaku.git" }
uwuipy = { git = "https://github.com/EvictServices/uwuipy.git" }